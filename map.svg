<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2a47" />
      <stop offset="50%" stop-color="#0e375d" />
      <stop offset="100%" stop-color="#071e33" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="700" height="380" rx="24" fill="url(#bgGrad)" stroke="#225a88" stroke-width="2"/>

  <!-- Subtle Blueprint grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="700" y2="60"/>
    <line x1="0" y1="120" x2="700" y2="120"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="240" x2="700" y2="240"/>
    <line x1="0" y1="300" x2="700" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
  </g>

  <!-- Main Roads (Golden outline style like blueprint) -->
  <!-- National Road 5 / Main Avenue -->
  <path d="M 470 380 L 470 160 L 460 0" stroke="#f6c26b" stroke-width="14" fill="none" opacity="0.8"/>
  <path d="M 470 380 L 470 160 L 460 0" stroke="#0e375d" stroke-width="8" fill="none"/>
  
  <path d="M 500 380 L 495 160 L 485 0" stroke="#f6c26b" stroke-width="12" fill="none" opacity="0.8"/>
  <path d="M 500 380 L 495 160 L 485 0" stroke="#0e375d" stroke-width="6" fill="none"/>

  <!-- Connecting Highway / Street 598 -->
  <path d="M 20 230 L 100 240 L 200 190 L 390 220 L 470 230" stroke="#f6c26b" stroke-width="12" fill="none" stroke-linejoin="round"/>
  <path d="M 20 230 L 100 240 L 200 190 L 390 220 L 470 230" stroke="#0e375d" stroke-width="6" fill="none" stroke-linejoin="round"/>

  <!-- Diagonal Road -->
  <path d="M 195 240 L 225 140 L 255 0" stroke="#f6c26b" stroke-width="10" fill="none"/>
  <path d="M 195 240 L 225 140 L 255 0" stroke="#0e375d" stroke-width="4" fill="none"/>

  <!-- Side branch roads -->
  <path d="M 40 280 L 100 240 L 115 310" stroke="#f6c26b" stroke-width="8" fill="none"/>
  <path d="M 40 280 L 100 240 L 115 310" stroke="#0e375d" stroke-width="3" fill="none"/>

  <!-- Distance indicator with dashes & arrow -->
  <path d="M 210 205 L 430 230" stroke="#f6c26b" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
  <polygon points="270,210 280,205 280,215" fill="#f6c26b"/>
  <text x="295" y="213" fill="#ffd58b" font-family="'Kantumruy Pro', sans-serif" font-size="13" font-weight="bold">1.1km</text>

  <!-- Venue / Reception Building illustration -->
  <g transform="translate(340, 165)">
    <!-- Palace / Venue Icon -->
    <rect x="-35" y="-35" width="70" height="40" fill="#0c3254" stroke="#f6c26b" stroke-width="2" rx="4"/>
    <!-- Dome / Arch -->
    <path d="M -20 -35 Q 0 -55 20 -35 Z" fill="#0c3254" stroke="#f6c26b" stroke-width="2"/>
    <circle cx="0" cy="-45" r="4" fill="#f6c26b"/>
    <!-- Arches -->
    <path d="M -25 -5 L -25 -20 Q -15 -30 -5 -20 L -5 -5 Z" fill="#f6c26b" opacity="0.6"/>
    <path d="M 5 -5 L 5 -20 Q 15 -30 25 -20 L 25 -5 Z" fill="#f6c26b" opacity="0.6"/>
    <path d="M -10 -5 L -10 -25 Q 0 -35 10 -25 L 10 -5 Z" fill="#ffd58b"/>
    <!-- Venue Name Label -->
    <rect x="-85" y="-72" width="170" height="24" rx="6" fill="#0a253f" stroke="#f6c26b" stroke-width="1"/>
    <text x="0" y="-56" text-anchor="middle" fill="#ffe29c" font-family="'Kantumruy Pro', sans-serif" font-size="12" font-weight="bold">ភោជនីយដ្ឋាន សេនរេប្រាយ យីង</text>
  </g>

  <!-- Antenna / Tower icon -->
  <g transform="translate(150, 190)" stroke="#f6c26b" stroke-width="1.5" fill="none">
    <line x1="0" y1="10" x2="-15" y2="40"/>
    <line x1="0" y1="10" x2="15" y2="40"/>
    <line x1="-8" y1="25" x2="8" y2="25"/>
    <circle cx="0" cy="10" r="3" fill="#f6c26b"/>
    <path d="M -6 5 A 8 8 0 0 1 6 5"/>
    <path d="M -10 0 A 13 13 0 0 1 10 0"/>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(240, 275)">
    <circle cx="0" cy="0" r="16" fill="#0e375d" stroke="#f6c26b" stroke-width="1.5"/>
    <polygon points="0,-14 4,-3 14,0 4,3 0,14 -4,3 -14,0 -4,-3" fill="#f6c26b"/>
    <text x="0" y="-18" text-anchor="middle" fill="#ffd58b" font-family="'Kantumruy Pro', sans-serif" font-size="10">ជើង</text>
    <text x="0" y="27" text-anchor="middle" fill="#ffd58b" font-family="'Kantumruy Pro', sans-serif" font-size="10">ត្បូង</text>
    <text x="24" y="3" text-anchor="start" fill="#ffd58b" font-family="'Kantumruy Pro', sans-serif" font-size="10">កើត</text>
    <text x="-24" y="3" text-anchor="end" fill="#ffd58b" font-family="'Kantumruy Pro', sans-serif" font-size="10">លិច</text>
  </g>

  <!-- Road Labels -->
  <text x="18" y="270" fill="#ffd58b" font-family="'Kantumruy Pro', sans-serif" font-size="10" transform="rotate(-65 18 270)">ផ្លូវលេខ 598</text>
  <text x="515" y="190" fill="#ffd58b" font-family="'Kantumruy Pro', sans-serif" font-size="11" transform="rotate(85 515 190)">ផ្លូវ 5 ជាតិ</text>
  <text x="215" y="30" fill="#ffd58b" font-family="'Kantumruy Pro', sans-serif" font-size="10" transform="rotate(-40 215 30)">ស្ពានព្រែកព្នៅ</text>

  <!-- Right Section: QR Code & Contact Box -->
  <g transform="translate(525, 45)">
    <text x="80" y="20" text-anchor="middle" fill="#ffe29c" font-family="'Moul', 'Kantumruy Pro', sans-serif" font-size="16" font-weight="bold">ស្កេនទីតាំង</text>
    
    <!-- Stylized QR Code -->
    <rect x="15" y="35" width="130" height="130" rx="8" fill="#ffffff"/>
    <!-- QR Finder patterns -->
    <rect x="25" y="45" width="34" height="34" fill="#0b3b60" rx="4"/>
    <rect x="31" y="51" width="22" height="22" fill="#ffffff" rx="2"/>
    <rect x="36" y="56" width="12" height="12" fill="#0b3b60" rx="1"/>

    <rect x="101" y="45" width="34" height="34" fill="#0b3b60" rx="4"/>
    <rect x="107" y="51" width="22" height="22" fill="#ffffff" rx="2"/>
    <rect x="112" y="56" width="12" height="12" fill="#0b3b60" rx="1"/>

    <rect x="25" y="121" width="34" height="34" fill="#0b3b60" rx="4"/>
    <rect x="31" y="127" width="22" height="22" fill="#ffffff" rx="2"/>
    <rect x="36" y="132" width="12" height="12" fill="#0b3b60" rx="1"/>

    <!-- QR Data Matrix Pixels -->
    <rect x="68" y="45" width="8" height="18" fill="#0b3b60"/>
    <rect x="80" y="55" width="12" height="8" fill="#0b3b60"/>
    <rect x="68" y="80" width="24" height="24" fill="#0b3b60"/>
    <rect x="25" y="90" width="10" height="12" fill="#0b3b60"/>
    <rect x="42" y="95" width="14" height="12" fill="#0b3b60"/>
    <rect x="105" y="90" width="12" height="10" fill="#0b3b60"/>
    <rect x="120" y="85" width="10" height="22" fill="#0b3b60"/>
    <rect x="68" y="115" width="18" height="10" fill="#0b3b60"/>
    <rect x="95" y="120" width="12" height="14" fill="#0b3b60"/>
    <rect x="115" y="125" width="18" height="16" fill="#0b3b60"/>
    <rect x="75" y="135" width="10" height="20" fill="#0b3b60"/>
    <circle cx="80" cy="92" r="5" fill="#f6c26b"/>

    <!-- Contact Info -->
    <text x="80" y="195" text-anchor="middle" fill="#ffd58b" font-family="'Kantumruy Pro', sans-serif" font-size="13" font-weight="bold">លេខទំនាក់ទំនងម្ចាស់កម្មវិធី</text>
    
    <g font-family="'Kantumruy Pro', sans-serif" font-size="12" fill="#ffffff">
      <text x="15" y="222"><tspan fill="#f6c26b" font-weight="bold">Metfone :</tspan> 097 258 15 37</text>
      <text x="15" y="242"><tspan fill="#4ade80" font-weight="bold">Smart :</tspan> 011 867 506</text>
      <text x="15" y="262"><tspan fill="#f59e0b" font-weight="bold">Cellcard :</tspan> 089 483 683</text>
    </g>
  </g>
</svg>
