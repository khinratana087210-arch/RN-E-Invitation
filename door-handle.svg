<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="60" height="96">
  <defs>
    <linearGradient id="goldHandleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="35%" stop-color="#e9af36"/>
      <stop offset="70%" stop-color="#ab6b08"/>
      <stop offset="100%" stop-color="#fff2be"/>
    </linearGradient>
    <filter id="handleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Plate (Khmer Floral Rosette) -->
  <g filter="url(#handleShadow)">
    <circle cx="50" cy="50" r="32" fill="url(#goldHandleGrad)" stroke="#523204" stroke-width="2"/>
    <circle cx="50" cy="50" r="24" fill="#3a1b02"/>
    <!-- Lotus Petals on Plate -->
    <path d="M 50 28 Q 55 38 50 48 Q 45 38 50 28 Z" fill="#ffd978"/>
    <path d="M 50 72 Q 55 62 50 52 Q 45 62 50 72 Z" fill="#ffd978"/>
    <path d="M 28 50 Q 38 55 48 50 Q 38 45 28 50 Z" fill="#ffd978"/>
    <path d="M 72 50 Q 62 55 52 50 Q 62 45 72 50 Z" fill="#ffd978"/>
    <circle cx="50" cy="50" r="8" fill="url(#goldHandleGrad)"/>

    <!-- Lion / Ring Mount -->
    <rect x="42" y="44" width="16" height="18" rx="4" fill="url(#goldHandleGrad)" stroke="#4a2503" stroke-width="1.5"/>

    <!-- Hanging Ring Pull Handle -->
    <path d="M 50 56 C 24 56 24 130 50 130 C 76 130 76 56 50 56 Z" 
          fill="none" stroke="url(#goldHandleGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Inner groove on Ring -->
    <path d="M 50 63 C 30 63 30 123 50 123 C 70 123 70 63 50 63 Z" 
          fill="none" stroke="#5a3304" stroke-width="2"/>
    <!-- Bottom Drop Accent -->
    <circle cx="50" cy="130" r="7" fill="url(#goldHandleGrad)" stroke="#4a2503" stroke-width="1.5"/>
  </g>
</svg>
